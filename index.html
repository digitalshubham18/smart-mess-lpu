<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <!-- Primary SEO -->
    <title>LPU Smart Mess — Hostel Mess Demand Forecasting &amp; Food-Waste Management</title>
    <meta name="description" content="LPU Smart Mess is the hostel-mess management platform for Lovely Professional University: real-time meal demand forecasting, food-waste tracking, QR attendance, inventory, finance, and sustainability reporting across every hostel mess." />
    <meta name="keywords" content="LPU Smart Mess, hostel mess management, food waste tracking, mess demand forecasting, Lovely Professional University, QR meal attendance, hostel dining management" />
    <meta name="author" content="LPU Smart Mess" />
    <!-- TODO: most routes sit behind login and are useless to a crawler that can't
         authenticate — this index.html is effectively the only page worth indexing
         (it serves every route in this client-rendered SPA). Update CANONICAL_URL
         below to your real deployed domain before going live; see robots.txt /
         sitemap.xml, which reference the same placeholder. -->
    <link rel="canonical" href="https://smartmess.lpu.in/" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#3554D1" />

    <!-- Open Graph / link-preview cards (WhatsApp, Slack, LinkedIn, etc.) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="LPU Smart Mess" />
    <meta property="og:title" content="LPU Smart Mess — Hostel Mess Demand Forecasting & Food-Waste Management" />
    <meta property="og:description" content="Real-time meal demand forecasting, food-waste tracking, QR attendance, inventory, and finance for every hostel mess at Lovely Professional University." />
    <meta property="og:url" content="https://smartmess.lpu.in/" />
    <meta property="og:image" content="https://smartmess.lpu.in/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_IN" />

    <!-- Twitter/X card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="LPU Smart Mess — Hostel Mess Demand Forecasting & Food-Waste Management" />
    <meta name="twitter:description" content="Real-time meal demand forecasting, food-waste tracking, QR attendance, inventory, and finance for every hostel mess at Lovely Professional University." />
    <meta name="twitter:image" content="https://smartmess.lpu.in/og-image.png" />

    <!-- Structured data: lets search engines show this as a known software application -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "LPU Smart Mess",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "Web",
        "description": "Hostel-mess demand forecasting and food-waste management platform for Lovely Professional University.",
        "url": "https://smartmess.lpu.in/",
        "publisher": { "@type": "CollegeOrUniversity", "name": "Lovely Professional University" }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
