<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Google Search Console Verification -->
    <meta
      name="google-site-verification"
      content="reNdUHKOJPLRYNj4qZgRcqJixuznSAkI3KpprSEcanQ"
    />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Primary SEO -->
    <title>LPU Smart Mess | Smart Hostel Mess Management System</title>

    <meta
      name="description"
      content="LPU Smart Mess is a smart hostel mess management platform for Lovely Professional University. Manage meal demand forecasting, food waste, QR attendance, inventory, finance and sustainability."
    />

    <meta
      name="keywords"
      content="LPU Smart Mess, LPU mess management, hostel mess management system, Lovely Professional University, food waste management, meal demand forecasting, QR meal attendance"
    />

    <meta name="author" content="LPU Smart Mess" />

    <!-- Canonical URL -->
    <link
      rel="canonical"
      href="https://smart-mess-lpu.vercel.app/"
    />

    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#3554D1" />

    <!-- Open Graph SEO -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="LPU Smart Mess" />

    <meta
      property="og:title"
      content="LPU Smart Mess | Smart Hostel Mess Management System"
    />

    <meta
      property="og:description"
      content="Smart hostel mess management with meal demand forecasting, food waste tracking, QR attendance, inventory and sustainability."
    />

    <meta
      property="og:url"
      content="https://smart-mess-lpu.vercel.app/"
    />

    <meta
      property="og:image"
      content="https://smart-mess-lpu.vercel.app/og-image.png"
    />

    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_IN" />

    <!-- Twitter / X SEO -->
    <meta name="twitter:card" content="summary_large_image" />

    <meta
      name="twitter:title"
      content="LPU Smart Mess | Smart Hostel Mess Management System"
    />

    <meta
      name="twitter:description"
      content="A smart hostel mess management platform for Lovely Professional University."
    />

    <meta
      name="twitter:image"
      content="https://smart-mess-lpu.vercel.app/og-image.png"
    />

    <!-- Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "LPU Smart Mess",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "Web",
        "description": "Smart hostel mess management platform featuring meal demand forecasting, food waste tracking, QR attendance and inventory management.",
        "url": "https://smart-mess-lpu.vercel.app/",
        "publisher": {
          "@type": "Organization",
          "name": "LPU Smart Mess"
        }
      }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
